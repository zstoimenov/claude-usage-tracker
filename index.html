<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Claude Usage Cycle</title>

  <!-- PWA Meta -->
  <meta name="description" content="Track your Claude weekly usage cycle — resets every Wednesday at 13:00 AWST" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claude Cycle" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      color: #e2e8f0;
    }

    #app {
      width: 100%;
      max-width: 560px;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .header-sub {
      font-size: 13px;
      color: #64748b;
    }
    .header-countdown {
      font-size: 11px;
      color: #475569;
      margin-left: 6px;
    }

    /* ── Big % ───────────────────────────────────────────────────────────── */
    .big-pct {
      text-align: center;
      margin-bottom: 28px;
    }
    .big-pct .number {
      font-size: clamp(64px, 16vw, 88px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      transition: color 1s;
    }
    .big-pct .unit {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 400;
      color: #cbd5e1;
    }
    .big-pct .sub {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* ── Main bar ────────────────────────────────────────────────────────── */
    .main-bar-wrap {
      background: #1e293b;
      border-radius: 12px;
      overflow: visible;
      height: 20px;
      margin-bottom: 8px;
      position: relative;
    }
    .main-bar-inner {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      overflow: hidden;
    }
    .main-bar-weekly-marker {
      position: absolute;
      top: 50%;
      width: 2px;
      height: 28px;
      background: #f8fafc;
      border-radius: 1px;
      transform: translate(-50%, -50%);
      z-index: 3;
      box-shadow: 0 0 4px rgba(248,250,252,0.53);
      transition: left 0.5s;
    }
    .main-bar-weekly-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: 700;
      color: #f8fafc;
      z-index: 4;
      pointer-events: none;
      transition: left 0.5s;
      text-shadow: 0 0 6px rgba(15,23,42,0.9);
      white-space: nowrap;
    }
    .main-bar-fill {
      height: 100%;
      border-radius: 12px;
      transition: width 0.5s, background 1s;
    }
    .main-bar-tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 100%;
      background: rgba(15,23,42,0.4);
    }
    .main-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 28px;
    }

    /* ── Day grid ────────────────────────────────────────────────────────── */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 28px;
    }
    .day-cell {
      text-align: center;
    }
    .day-bar {
      position: relative;
      background: #1e293b;
      border-radius: 6px;
      height: 6px;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .day-bar-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s;
    }
    .day-marker {
      position: absolute;
      top: 50%;
      width: 2px;
      height: 12px;
      background: #f8fafc;
      border-radius: 1px;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: 0 0 4px rgba(248,250,252,0.53);
    }
    .day-label {
      font-size: 11px;
      transition: color 0.3s;
    }
    .day-time {
      font-size: 9px;
      color: #64748b;
      margin-top: 1px;
    }

    /* ── Stats grid ──────────────────────────────────────────────────────── */
    .stats-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 20px;
    }

    /* ── Pacing card (velocity reframe) ──────────────────────────────────── */
    .stat-card-pace {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px 20px;
      transition: opacity 0.3s;
    }
    .stat-card-pace.stale .pace-primary,
    .stat-card-pace.stale .pace-secondary {
      opacity: 0.4;
    }
    .pace-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pace-top-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .pace-primary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      transition: opacity 0.3s;
    }
    .pace-required {
      font-size: 28px;
      font-weight: 700;
      color: #e2e8f0;
      line-height: 1;
    }
    .pace-required-unit {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
    }
    .pace-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .pace-badge.slow-down      { background: #0c2d4a; color: #60a5fa; }
    .pace-badge.on-pace        { background: #14532d; color: #4ade80; }
    .pace-badge.behind         { background: #422006; color: #eab308; }
    .pace-badge.falling-behind { background: #450a0a; color: #ef4444; }
    .pace-badge.stale          { background: #1e293b; color: #64748b; border: 1px solid #334155; }
    .pace-badge.empty          { background: #1e293b; color: #475569; border: 1px solid #334155; }
    .pace-secondary {
      font-size: 11px;
      color: #64748b;
      transition: opacity 0.3s;
    }
    .pace-empty {
      font-size: 12px;
      color: #64748b;
      font-style: italic;
    }
    .pace-stale-caption {
      font-size: 10px;
      color: #f59e0b;
      margin-top: 2px;
    }
    .pace-capacity-row {
      font-size: 11px;
      color: #94a3b8;
      padding-top: 8px;
      border-top: 1px solid #0f172a;
      margin-top: 2px;
    }
    .pace-capacity-row.forfeit { color: #f87171; }

    .checkins-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .checkin-row {
      display: flex;
      align-items: baseline;
    }
    .checkin-time {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .checkin-dots {
      flex: 1;
      border-bottom: 1px dotted #334155;
      margin: 0 8px 3px;
    }
    .checkin-pct {
      font-size: 16px;
      font-weight: 700;
      color: #e2e8f0;
      flex-shrink: 0;
    }

    /* ── Session Tracker toggle ──────────────────────────────────────────── */
    .tracker-toggle {
      width: 100%;
      background: none;
      border: 1px solid #1e293b;
      border-radius: 10px;
      color: #475569;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s, color 0.2s;
    }
    .tracker-toggle:hover {
      border-color: #334155;
      color: #64748b;
    }
    .tracker-toggle .arrow {
      display: inline-block;
      transition: transform 0.25s;
      font-style: normal;
    }
    .tracker-toggle.open .arrow {
      transform: rotate(180deg);
    }

    .tracker-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      opacity: 0;
    }
    .tracker-panel.open {
      max-height: 1400px;
      opacity: 1;
    }

    .tracker-inner {
      padding-top: 16px;
      padding-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Drift card ──────────────────────────────────────────────────────── */
    .drift-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 16px;
    }
    .drift-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .drift-card-title {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .drift-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .drift-badge.on-track  { background: #14532d; color: #4ade80; }
    .drift-badge.drifting  { background: #422006; color: #eab308; }
    .drift-badge.at-risk   { background: #431407; color: #f97316; }
    .drift-badge.critical  { background: #450a0a; color: #ef4444; }
    .drift-badge.no-data   { background: #1e293b; color: #475569; border: 1px solid #334155; }

    .drift-bars { display: flex; flex-direction: column; gap: 6px; }
    .drift-bar-row { display: flex; align-items: center; gap: 8px; }
    .drift-bar-row-label {
      font-size: 10px; color: #64748b;
      width: 44px; flex-shrink: 0; text-align: right;
    }
    .drift-bar-track {
      flex: 1; background: #0f172a;
      border-radius: 4px; height: 8px;
      position: relative; overflow: hidden;
    }
    .drift-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .drift-bar-value { font-size: 10px; color: #94a3b8; width: 36px; flex-shrink: 0; }
    .drift-gap-label {
      text-align: center; font-size: 11px;
      color: #64748b; margin-top: 8px;
    }

    .spot-check-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .spot-check-row input {
      flex: 1; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #e2e8f0; font-size: 13px;
      padding: 8px 12px; outline: none; transition: border-color 0.2s;
    }
    .spot-check-row input:focus { border-color: #475569; }
    .spot-check-row input::placeholder { color: #334155; }
    .spot-btn {
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      color: #94a3b8; font-size: 12px; padding: 8px 14px;
      cursor: pointer; white-space: nowrap; transition: background 0.2s, color 0.2s;
    }
    .spot-btn:hover { background: #334155; color: #e2e8f0; }

    /* ── Sessions card ───────────────────────────────────────────────────── */
    .sessions-card {
      background: #1e293b; border-radius: 10px; padding: 16px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .sessions-stat-label {
      font-size: 11px; color: #475569;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
    }
    .sessions-stat-value { font-size: 22px; font-weight: 700; color: #e2e8f0; }
    .sessions-stat-sub { font-size: 10px; color: #475569; margin-top: 2px; }

    /* ── Log card ────────────────────────────────────────────────────────── */
    .log-card { background: #1e293b; border-radius: 10px; padding: 16px; }
    .log-card-title {
      font-size: 11px; color: #64748b;
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
    }
    .log-inputs {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 10px;
    }
    .log-field label {
      display: block; font-size: 10px; color: #64748b;
      margin-bottom: 4px; letter-spacing: 0.5px;
    }
    .log-field input {
      width: 100%; background: #0f172a; border: 1px solid #334155;
      border-radius: 8px; color: #e2e8f0; font-size: 14px;
      padding: 8px 10px; outline: none; transition: border-color 0.2s;
    }
    .log-field input:focus { border-color: #475569; }
    .log-field input::placeholder { color: #334155; }
    .log-row { display: flex; gap: 8px; align-items: center; }
    .log-delta-preview { font-size: 11px; color: #475569; flex: 1; }
    .log-delta-preview span { color: #22c55e; font-weight: 600; }
    .log-btn {
      background: #0f4c81; border: none; border-radius: 8px;
      color: #bfdbfe; font-size: 12px; font-weight: 600;
      padding: 9px 16px; cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .log-btn:hover { background: #1e5f9a; }
    .log-btn:disabled { background: #1e293b; color: #334155; cursor: not-allowed; }

    /* ── History card ────────────────────────────────────────────────────── */
    .history-card { background: #1e293b; border-radius: 10px; padding: 16px; }
    .history-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px;
    }
    .history-title {
      font-size: 11px; color: #64748b;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .clear-btn {
      background: none; border: 1px solid #334155; border-radius: 6px;
      color: #475569; font-size: 10px; padding: 3px 8px;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
    }
    .clear-btn:hover { color: #f87171; border-color: #f87171; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .history-table th {
      color: #64748b; font-weight: 500; text-align: left;
      padding: 0 4px 6px; letter-spacing: 0.5px; font-size: 10px;
    }
    .history-table td { color: #94a3b8; padding: 5px 4px; border-top: 1px solid #0f172a; }
    .history-table td.delta-pos { color: #4ade80; font-weight: 600; }
    .history-table td.delta-neg { color: #f87171; font-weight: 600; }
    .history-empty {
      text-align: center; color: #475569;
      font-size: 12px; padding: 16px 0 4px;
    }

    /* ── Time-left pill selector ─────────────────────────────────────────── */
    .time-left-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .time-left-label {
      font-size: 10px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
    .time-left-pills {
      display: flex;
      gap: 6px;
    }
    .time-pill {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #475569;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 0;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      user-select: none;
    }
    .time-pill:hover { border-color: #475569; color: #94a3b8; }
    .time-pill.selected {
      background: #0f4c81;
      border-color: #1d6fa8;
      color: #bfdbfe;
    }

    /* ── FAB (Log a Session shortcut) ────────────────────────────────────── */
    .fab {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #0f4c81;
      border: none;
      color: #bfdbfe;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: background 0.2s, transform 0.15s, opacity 0.25s;
      z-index: 100;
    }
    .fab:hover { background: #1e5f9a; transform: scale(1.07); }
    .fab:active { transform: scale(0.95); }
    .fab.hidden { opacity: 0; pointer-events: none; }

    /* ── Log sheet (bottom sheet) ────────────────────────────────────────── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0);
      z-index: 200;
      pointer-events: none;
      transition: background 0.3s;
    }
    .sheet-backdrop.open {
      background: rgba(0,0,0,0.6);
      pointer-events: all;
    }
    .sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e293b;
      border-radius: 16px 16px 0 0;
      padding: 0 20px max(20px, env(safe-area-inset-bottom));
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
      max-width: 560px;
      margin: 0 auto;
    }
    .sheet.open {
      transform: translateY(0);
    }
    .sheet-handle-row {
      display: flex;
      justify-content: center;
      padding: 12px 0 4px;
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 14px;
    }
    .sheet-title {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
    }
    .sheet-close {
      background: none;
      border: none;
      color: #475569;
      font-size: 20px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      transition: color 0.2s;
    }
    .sheet-close:hover { color: #94a3b8; }

    /* Sheet reuses .log-inputs / .log-field / .log-row / .log-btn styles */
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- FAB -->
  <button class="fab" id="fab" aria-label="Log a session">+</button>

  <!-- Bottom sheet backdrop -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <!-- Bottom sheet -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Log a Session">
    <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <span class="sheet-title">Log a Session</span>
      <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <div class="log-inputs">
      <div class="log-field">
        <label>Week % Before</label>
        <input type="number" id="sheetBefore" min="0" max="100" step="0.1" placeholder="e.g. 23" inputmode="decimal" />
      </div>
      <div class="log-field">
        <label>Session % Used</label>
        <input type="number" id="sheetSession" min="1" max="100" step="1" placeholder="e.g. 80" inputmode="decimal" />
      </div>
      <div class="log-field">
        <label>Week % After</label>
        <input type="number" id="sheetAfter" min="0" max="100" step="0.1" placeholder="e.g. 28" inputmode="decimal" />
      </div>
    </div>
    <div class="time-left-row">
      <div class="time-left-label">Time left in session (optional)</div>
      <div class="time-left-pills" id="sheetTimePills">
        <button class="time-pill" data-ms="14400000">~4h</button>
        <button class="time-pill" data-ms="10800000">~3h</button>
        <button class="time-pill" data-ms="7200000">~2h</button>
        <button class="time-pill" data-ms="3600000">~1h</button>
        <button class="time-pill" data-ms="1800000">&lt;30m</button>
      </div>
    </div>
    <div class="log-row">
      <div class="log-delta-preview" id="sheetPreview">Fill in all three fields to preview</div>
      <button class="log-btn" id="sheetLogBtn" disabled>+ Log Session</button>
    </div>
  </div>

  <script>
    // ─── Constants ────────────────────────────────────────────────────────────
    const CYCLE_MS       = 7 * 24 * 60 * 60 * 1000;
    const AWST_OFFSET_MS = 8 * 60 * 60 * 1000;
    const DAY_LABELS     = ["Wed", "Thu", "Fri", "Sat", "Sun", "Mon", "Tue"];
    const DAY_ORDER      = [3, 4, 5, 6, 0, 1, 2];
    const MARKER_PCT     = (13 / 24) * 100;
    const WED_WINDOW     = 100 - MARKER_PCT;
    const STORAGE_KEY    = "claude-tracker-v1";

    // ─── Pacing constants (velocity model) ────────────────────────────────────
    const WAKING_HOURS_PER_DAY = 14;             // 07:30–21:30 AWST
    const SESSION_LOCK_HOURS   = 5;
    const SLOTS_PER_DAY_MAX    = WAKING_HOURS_PER_DAY / SESSION_LOCK_HOURS;  // 2.8
    const STALE_SIGNAL_MS      = 5 * 3600000;    // 5h
    const CAPACITY_TRIGGER     = 0.7;
    const EDGE_WINDOW_MS       = 6 * 3600000;    // 6h start/end edge cases

    // ─── Time helpers ─────────────────────────────────────────────────────────
    function getCycleStartUTC() {
      const nowMs    = Date.now();
      const awstMs   = nowMs + AWST_OFFSET_MS;
      const awstDate = new Date(awstMs);
      const dayOfWeek = awstDate.getUTCDay();
      const hourAWST  = awstDate.getUTCHours();
      const minAWST   = awstDate.getUTCMinutes();
      const secAWST   = awstDate.getUTCSeconds();
      let daysSinceWed = (dayOfWeek - 3 + 7) % 7;
      if (daysSinceWed === 0 && hourAWST < 13) daysSinceWed = 7;
      const elapsedTodayMs =
        hourAWST * 3600000 + minAWST * 60000 +
        secAWST * 1000     + awstDate.getUTCMilliseconds();
      const midnightWedAWST = awstMs - elapsedTodayMs - daysSinceWed * 24 * 3600000;
      const cycleStartAWST  = midnightWedAWST + 13 * 3600000;
      return cycleStartAWST - AWST_OFFSET_MS;
    }

    function getActiveDayIndex() {
      const awstDate = new Date(Date.now() + AWST_OFFSET_MS);
      return DAY_ORDER.indexOf(awstDate.getUTCDay());
    }

    function formatDuration(ms) {
      if (ms <= 0) return "0m";
      const totalMin = Math.floor(ms / 60000);
      const d = Math.floor(totalMin / 1440);
      const h = Math.floor((totalMin % 1440) / 60);
      const m = totalMin % 60;
      const parts = [];
      if (d) parts.push(d + "d");
      if (h) parts.push(h + "h");
      if (m || (!d && !h)) parts.push(m + "m");
      return parts.join(" ");
    }

    function formatShortDate(utcMs) {
      return new Date(utcMs).toLocaleString("en-AU", {
        timeZone: "Australia/Perth",
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
        hour12: false,
      });
    }

    function formatSignalAge(ms) {
      if (ms === null || ms === undefined) return "no signal";
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      return h > 0 ? `${h}h ${m}m old` : `${m}m old`;
    }

    function getNextCheckIns() {
      const nowMs        = Date.now();
      const cycleStartMs = getCycleStartUTC();
      const checkTimes   = [7.5, 19.5];
      const results      = [];

      for (let dayOffset = 0; dayOffset <= 1 && results.length < 2; dayOffset++) {
        for (let ci = 0; ci < checkTimes.length && results.length < 2; ci++) {
          const awstNow      = new Date(nowMs + AWST_OFFSET_MS);
          const awstMidnight = Date.UTC(
            awstNow.getUTCFullYear(), awstNow.getUTCMonth(), awstNow.getUTCDate()
          ) + dayOffset * 86400000;
          const candidateUtcMs = awstMidnight + checkTimes[ci] * 3600000 - AWST_OFFSET_MS;
          if (candidateUtcMs > nowMs && candidateUtcMs <= nowMs + 86400000) {
            const elapsed = candidateUtcMs - cycleStartMs;
            const pct     = Math.min(100, Math.max(0, (elapsed / CYCLE_MS) * 100));
            const label   = new Date(candidateUtcMs).toLocaleString("en-AU", {
              timeZone: "Australia/Perth",
              weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false,
            });
            results.push({ label, pct });
          }
        }
      }
      return results;
    }

    function barColour(driftStatus) {
      switch (driftStatus) {
        case "on-track": return "#22c55e";
        case "drifting": return "#eab308";
        case "at-risk":  return "#f97316";
        case "critical": return "#ef4444";
        default:         return "#94a3b8";
      }
    }

    // ─── Pacing (velocity model) ──────────────────────────────────────────────
    function getFreshestSignalAge(trackerData) {
      const nowMs = Date.now();
      let bestTs = 0;
      const sw = trackerData.spotWeekly;
      if (sw && sw.ts) bestTs = Math.max(bestTs, sw.ts);
      if (trackerData.sessions.length > 0) bestTs = Math.max(bestTs, trackerData.sessions[0].ts);
      if (bestTs === 0) return null;
      return nowMs - bestTs;
    }

    function calcPacing(trackerData) {
      const nowMs        = Date.now();
      const cycleStartMs = getCycleStartUTC();
      const cycleEndMs   = cycleStartMs + CYCLE_MS;
      const daysElapsed  = (nowMs - cycleStartMs) / 86400000;
      const daysRemaining = (cycleEndMs - nowMs) / 86400000;
      const weeklyPct    = trackerData.spotWeekly !== null ? trackerData.spotWeekly.value : null;
      const signalAgeMs  = getFreshestSignalAge(trackerData);
      const isStale      = signalAgeMs !== null && signalAgeMs > STALE_SIGNAL_MS;

      // Empty state — no weekly % yet
      if (weeklyPct === null) {
        return { state: "empty", message: "Set current weekly % to calculate pace" };
      }

      // Edge: cycle just started
      if (nowMs - cycleStartMs < EDGE_WINDOW_MS) {
        return { state: "starting", message: "Cycle just started — log some sessions" };
      }

      // Edge: final stretch
      if (cycleEndMs - nowMs < EDGE_WINDOW_MS) {
        const usageLeft = Math.max(0, 100 - weeklyPct);
        return { state: "final", weeklyPct, usageLeft,
                 message: `Final stretch — ${usageLeft.toFixed(1)}% left to use`,
                 isStale, signalAgeMs };
      }

      // Normal velocity calculation
      const usageRemaining   = 100 - weeklyPct;
      const requiredDailyPct = usageRemaining / daysRemaining;
      const currentDailyPct  = daysElapsed > 0 ? weeklyPct / daysElapsed : 0;
      const paceRatio        = currentDailyPct > 0 ? requiredDailyPct / currentDailyPct : null;

      let badge, badgeLabel;
      if (paceRatio === null)        { badge = "empty";          badgeLabel = "No Pace Data"; }
      else if (paceRatio < 0.85)     { badge = "slow-down";      badgeLabel = "🔵 Slow Down"; }
      else if (paceRatio <= 1.15)    { badge = "on-pace";        badgeLabel = "🟢 On Pace"; }
      else if (paceRatio <= 1.5)     { badge = "behind";         badgeLabel = "🟡 Behind"; }
      else                           { badge = "falling-behind"; badgeLabel = "🔴 Falling Behind"; }

      // Capacity check (secondary, conditional)
      const avgData = calcAvg(trackerData.sessions);
      let capacity = null;
      if (avgData && usageRemaining > 0) {
        const slotsAvailable = Math.floor(daysRemaining * SLOTS_PER_DAY_MAX);
        const sessionsNeeded = usageRemaining / avgData.avg;
        const forfeitPct     = Math.max(0, (sessionsNeeded - slotsAvailable) * avgData.avg);
        const show           = sessionsNeeded > slotsAvailable * CAPACITY_TRIGGER;
        capacity = { slotsAvailable, sessionsNeeded, forfeitPct, show,
                     overCapacity: sessionsNeeded > slotsAvailable };
      }

      return {
        state: "normal",
        weeklyPct, daysElapsed, daysRemaining,
        requiredDailyPct, currentDailyPct, paceRatio,
        badge, badgeLabel,
        isStale, signalAgeMs,
        capacity
      };
    }

    // ─── Storage ──────────────────────────────────────────────────────────────
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { sessions: [], trackerOpen: false, spotWeekly: null };
        const data = JSON.parse(raw);
        if (typeof data.spotWeekly === "number") {
          data.spotWeekly = { value: data.spotWeekly, ts: 0 };
        }
        return data;
      } catch(e) {
        return { sessions: [], trackerOpen: false, spotWeekly: null };
      }
    }

    function saveData(data) {

    // ─── Calculations ─────────────────────────────────────────────────────────
    function calcAvg(sessions) {
      if (!sessions.length) return null;
      const normalized = sessions.map(s => s.normalizedDelta);
      const avg = normalized.reduce((a, b) => a + b, 0) / normalized.length;
      return { avg, min: Math.min(...normalized), max: Math.max(...normalized), n: sessions.length };
    }

    function getDriftStatus(weeklyPct, timePct) {
      if (weeklyPct === null || weeklyPct === undefined) return "no-data";
      const gap = Math.abs(weeklyPct - timePct);
      if (gap < 5)  return "on-track";
      if (gap < 10) return "drifting";
      if (gap < 20) return "at-risk";
      return "critical";
    }

    // ─── Render Layer 2 ───────────────────────────────────────────────────────
    function renderLayer2() {
      const nowMs        = Date.now();
      const cycleStartMs = getCycleStartUTC();
      const elapsedMs    = nowMs - cycleStartMs;
      const timePct      = Math.min(100, Math.max(0, (elapsedMs / CYCLE_MS) * 100));
      const weeklyPct    = trackerData.spotWeekly !== null ? trackerData.spotWeekly.value : null;

      // Drift bars
      const driftTimeBar   = document.getElementById("driftTimeBar");
      const driftWeeklyBar = document.getElementById("driftWeeklyBar");
      const driftTimeVal   = document.getElementById("driftTimeVal");
      const driftWeeklyVal = document.getElementById("driftWeeklyVal");
      const driftBadge     = document.getElementById("driftBadge");
      const driftGapLabel  = document.getElementById("driftGapLabel");

      driftTimeBar.style.width      = timePct + "%";
      driftTimeBar.style.background = "#475569";

      const status = getDriftStatus(weeklyPct, timePct);
      driftBadge.className   = "drift-badge " + status;
      driftBadge.textContent = getDriftLabel(status);

      if (weeklyPct !== null) {
        const wc = status === "on-track" ? "#22c55e" : status === "drifting" ? "#eab308"
                 : status === "at-risk"  ? "#f97316" : "#ef4444";
        driftWeeklyBar.style.width      = Math.min(100, weeklyPct) + "%";
        driftWeeklyBar.style.background = wc;
        driftWeeklyVal.textContent      = weeklyPct.toFixed(1) + "%";
        const gap = weeklyPct - timePct;
        driftGapLabel.style.color = wc;
        driftGapLabel.textContent = gap > 0 ? `You're ${gap.toFixed(1)}% over target`
                                  : gap < 0 ? `You're ${Math.abs(gap).toFixed(1)}% under target`
                                  : "Perfectly on target";
      } else {
        driftWeeklyBar.style.width = "0%";
        driftWeeklyVal.textContent = "—";
        driftGapLabel.textContent  = "Enter your current weekly % below to see drift";
        driftGapLabel.style.color  = "#475569";
      }

      // Sessions remaining
      const avgData        = calcAvg(trackerData.sessions);
      const sessionsLeftEl  = document.getElementById("sessionsLeft");
      const sessionsLeftSub = document.getElementById("sessionsLeftSub");
      const avgSessionVal   = document.getElementById("avgSessionVal");
      const avgSessionSub   = document.getElementById("avgSessionSub");

      if (avgData) {
        avgSessionVal.textContent = avgData.avg.toFixed(2) + "%";
        avgSessionSub.textContent = `based on ${avgData.n} session${avgData.n > 1 ? "s" : ""}`;
        if (weeklyPct !== null) {
          sessionsLeftEl.textContent  = ((100 - weeklyPct) / avgData.avg).toFixed(1);
          sessionsLeftSub.textContent = `at ${avgData.avg.toFixed(2)}% avg per session`;
        } else {
          sessionsLeftEl.textContent  = "—";
          sessionsLeftSub.textContent = "set weekly % to calculate";
        }
      } else {
        avgSessionVal.textContent   = "—";
        avgSessionSub.textContent   = "no sessions logged yet";
        sessionsLeftEl.textContent  = "—";
        sessionsLeftSub.textContent = "log sessions to calculate";
      }

      // History table
      const historyBody = document.getElementById("historyBody");
      const sessions    = trackerData.sessions.slice(0, 10);
      if (!sessions.length) {
        historyBody.innerHTML = `<div class="history-empty">No sessions logged yet</div>`;
        return;
      }
      historyBody.innerHTML = `
        <table class="history-table">
          <thead><tr>
            <th>Date</th><th>Week Before→After</th>
            <th>Session</th><th>Δ</th><th>Per 100%</th>
          </tr></thead>
          <tbody>${sessions.map(s => `
            <tr>
              <td>${formatShortDate(s.ts)}</td>
              <td>${s.weekBefore}%→${s.weekAfter}%</td>
              <td>${s.sessionUsed}%</td>
              <td class="delta-pos">+${s.delta.toFixed(1)}%</td>
              <td>${s.normalizedDelta.toFixed(2)}%</td>
            </tr>`).join("")}
          </tbody>
        </table>`;
    }

    // ─── Render Pacing card (velocity model) ──────────────────────────────────
    function renderPacing() {
      const pacing  = calcPacing(trackerData);
      const card             = document.getElementById("paceCard");
      const paceRequired     = document.getElementById("paceRequired");
      const paceRequiredUnit = document.getElementById("paceRequiredUnit");
      const paceSecondary    = document.getElementById("paceSecondary");
      const paceBadgeWrap    = document.getElementById("paceBadgeWrap");
      const staleCaption     = document.getElementById("paceStaleCaption");
      const capacityRow      = document.getElementById("paceCapacityRow");

      // Reset stale state by default
      card.classList.remove("stale");
      staleCaption.style.display = "none";
      capacityRow.style.display  = "none";

      // Empty state
      if (pacing.state === "empty") {
        paceRequired.textContent     = "—";
        paceRequiredUnit.textContent = "set weekly %";
        paceSecondary.textContent    = pacing.message;
        paceBadgeWrap.innerHTML      = `<span class="pace-badge empty">No Data</span>`;
        return;
      }

      // Cycle just started
      if (pacing.state === "starting") {
        paceRequired.textContent     = "—";
        paceRequiredUnit.textContent = "";
        paceSecondary.textContent    = pacing.message;
        paceBadgeWrap.innerHTML      = `<span class="pace-badge empty">Just Started</span>`;
        return;
      }

      // Final stretch
      if (pacing.state === "final") {
        paceRequired.textContent     = pacing.usageLeft.toFixed(1) + "%";
        paceRequiredUnit.textContent = "left to use";
        paceSecondary.textContent    = pacing.message;
        paceBadgeWrap.innerHTML      = `<span class="pace-badge ${pacing.usageLeft > 5 ? "behind" : "on-pace"}">Final Stretch</span>`;
        if (pacing.isStale) {
          card.classList.add("stale");
          staleCaption.style.display = "";
          staleCaption.textContent = `signal ${formatSignalAge(pacing.signalAgeMs)} — refresh below`;
        }
        return;
      }

      // Normal velocity state
      paceRequired.textContent     = pacing.requiredDailyPct.toFixed(1) + "%";
      paceRequiredUnit.textContent = "/day required";
      paceSecondary.textContent    = `current: ${pacing.currentDailyPct.toFixed(1)}%/day · ${pacing.daysRemaining.toFixed(1)} days left`;
      paceBadgeWrap.innerHTML      = `<span class="pace-badge ${pacing.badge}">${pacing.badgeLabel}</span>`;

      if (pacing.isStale) {
        card.classList.add("stale");
        // Override badge to stale grey
        paceBadgeWrap.innerHTML = `<span class="pace-badge stale">Stale</span>`;
        staleCaption.style.display = "";
        staleCaption.textContent = `signal ${formatSignalAge(pacing.signalAgeMs)} — refresh below`;
      }

      // Capacity row (conditional)
      if (pacing.capacity && pacing.capacity.show) {
        capacityRow.style.display = "";
        if (pacing.capacity.overCapacity) {
          capacityRow.classList.add("forfeit");
          capacityRow.textContent = `⚠ ~${pacing.capacity.forfeitPct.toFixed(1)}% allowance may be forfeited (need ${pacing.capacity.sessionsNeeded.toFixed(1)} of ~${pacing.capacity.slotsAvailable} slots)`;
        } else {
          capacityRow.classList.remove("forfeit");
          capacityRow.textContent = `Need ~${pacing.capacity.sessionsNeeded.toFixed(1)} of ~${pacing.capacity.slotsAvailable} slots remaining`;
        }
      }
    }

    // ─── Layer 1 Update loop ──────────────────────────────────────────────────
    function update() {
      const nowMs        = Date.now();
      const cycleStartMs = getCycleStartUTC();
      const cycleEndMs   = cycleStartMs + CYCLE_MS;
      const elapsedMs    = nowMs - cycleStartMs;
      const remainingMs  = cycleEndMs - nowMs;
      const pct          = Math.min(100, Math.max(0, (elapsedMs / CYCLE_MS) * 100));
      const spotValue    = trackerData.spotWeekly !== null ? trackerData.spotWeekly.value : null;
      const driftStatus  = getDriftStatus(spotValue, pct);
      const colour       = barColour(driftStatus);
      const activeDayIdx = getActiveDayIndex();

      document.getElementById("headerCountdown").textContent = "· " + formatDuration(remainingMs) + " left";

      const pctEl = document.getElementById("pctNumber");
      pctEl.style.color = colour;
      pctEl.innerHTML   = pct.toFixed(2) + '<span class="unit">%</span>';

      const fill = document.getElementById("mainBarFill");
      fill.style.width      = pct + "%";
      fill.style.background = `linear-gradient(90deg, ${colour}88, ${colour})`;

      DAY_LABELS.forEach((_, i) => {
        const done    = i < activeDayIdx;
        const active  = i === activeDayIdx;
        const bar     = document.getElementById("daybar-"  + i);
        const fillEl  = document.getElementById("dayfill-" + i);
        const labelEl = document.getElementById("daylabel-"+ i);

        bar.style.border         = active ? `1px solid ${colour}` : "1px solid transparent";
        labelEl.style.color      = active ? "#e2e8f0" : done ? "#64748b" : "#475569";
        labelEl.style.fontWeight = active ? "700" : "400";

        if (i === 0) {
          if (active) {
            const awstDate  = new Date(nowMs + AWST_OFFSET_MS);
            const msIntoDay = awstDate.getUTCHours() * 3600000 + awstDate.getUTCMinutes() * 60000 + awstDate.getUTCSeconds() * 1000;
            const dayPct    = (msIntoDay / (24 * 3600000)) * 100;
            if (dayPct < MARKER_PCT) {
              fillEl.style.left = "0%"; fillEl.style.width = dayPct + "%";
            } else {
              fillEl.style.left = MARKER_PCT + "%"; fillEl.style.width = (dayPct - MARKER_PCT) + "%";
            }
            fillEl.style.background = colour;
          } else if (done) {
            fillEl.style.left = MARKER_PCT + "%"; fillEl.style.width = WED_WINDOW + "%";
            fillEl.style.background = "#334155";
          } else {
            fillEl.style.left = "0%"; fillEl.style.width = "0%";
          }
        } else {
          fillEl.style.left = "0%";
          if (done) {
            fillEl.style.width = "100%"; fillEl.style.background = "#334155";
          } else if (active) {
            const awstDate  = new Date(nowMs + AWST_OFFSET_MS);
            const msIntoDay = awstDate.getUTCHours() * 3600000 + awstDate.getUTCMinutes() * 60000 + awstDate.getUTCSeconds() * 1000;
            fillEl.style.width = ((msIntoDay / (24 * 3600000)) * 100) + "%";
            fillEl.style.background = colour;
          } else {
            fillEl.style.width = "0%";
          }
        }
      });

      // Weekly usage marker on main bar
      const weeklyMarker = document.getElementById("mainBarWeeklyMarker");
      const weeklyLabel  = document.getElementById("mainBarWeeklyLabel");
      const sw = trackerData.spotWeekly;
      if (sw !== null && sw.value !== null) {
        const wPct = Math.min(100, Math.max(0, sw.value));
        weeklyMarker.style.display = "";
        weeklyMarker.style.left    = wPct + "%";
        weeklyLabel.style.display  = "";
        weeklyLabel.style.left     = Math.max(wPct - 1, 2) + "%";
        weeklyLabel.style.transform = "translate(-100%, -50%)";
        weeklyLabel.textContent    = sw.value.toFixed(1) + "%";
      } else {
        weeklyMarker.style.display = "none";
        weeklyLabel.style.display  = "none";
      }

      // Check-ins
      const checkIns = getNextCheckIns();
      const checkInsList = document.getElementById("checkInsList");
      checkInsList.innerHTML = checkIns.length
        ? checkIns.map(c => `
            <div class="checkin-row">
              <span class="checkin-time">${c.label}</span>
              <span class="checkin-dots"></span>
              <span class="checkin-pct">${c.pct.toFixed(1)}%</span>
            </div>`).join("")
        : `<span style="color:#475569;font-size:12px">—</span>`;

      renderPacing();
    }

    update();
    renderLayer2();
    setInterval(update, 60000);
    setInterval(renderLayer2, 60000);

    // ─── Service Worker ───────────────────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
