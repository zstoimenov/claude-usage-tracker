<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Claude Usage Cycle</title>

  <!-- PWA Meta -->
  <meta name="description" content="Track your Claude weekly usage cycle — resets every Wednesday at 13:00 AWST" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claude Cycle" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      color: #e2e8f0;
    }

    #app {
      width: 100%;
      max-width: 560px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .header-sub {
      font-size: 13px;
      color: #475569;
    }

    .big-pct {
      text-align: center;
      margin-bottom: 28px;
    }
    .big-pct .number {
      font-size: clamp(64px, 16vw, 88px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      transition: color 1s;
    }
    .big-pct .unit {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 400;
      color: #94a3b8;
    }
    .big-pct .sub {
      font-size: 14px;
      color: #64748b;
      margin-top: 6px;
    }

    .main-bar-wrap {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      height: 20px;
      margin-bottom: 8px;
      position: relative;
    }
    .main-bar-fill {
      height: 100%;
      border-radius: 12px;
      transition: width 0.5s, background 1s;
    }
    .main-bar-tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 100%;
      background: rgba(15,23,42,0.4);
    }
    .main-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #475569;
      margin-bottom: 28px;
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 28px;
    }
    .day-cell {
      text-align: center;
    }
    .day-bar {
      position: relative;
      background: #1e293b;
      border-radius: 6px;
      height: 6px;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .day-bar.active {
      /* border set dynamically */
    }
    .day-bar-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s;
    }
    .day-marker {
      position: absolute;
      top: 50%;
      width: 2px;
      height: 12px;
      background: #f8fafc;
      border-radius: 1px;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: 0 0 4px rgba(248,250,252,0.53);
    }
    .day-label {
      font-size: 11px;
      transition: color 0.3s;
    }
    .day-time {
      font-size: 9px;
      color: #475569;
      margin-top: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 11px;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      font-weight: 600;
    }
    .stat-value.large { font-size: 18px; }
    .stat-value.small { font-size: 12px; }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #334155;
      margin-bottom: 24px;
    }

    /* ── Layer 2: Session Tracker ─────────────────────────────────────────── */

    .tracker-toggle {
      width: 100%;
      background: none;
      border: 1px solid #1e293b;
      border-radius: 10px;
      color: #475569;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s, color 0.2s;
      margin-bottom: 0;
    }
    .tracker-toggle:hover {
      border-color: #334155;
      color: #64748b;
    }
    .tracker-toggle .arrow {
      display: inline-block;
      transition: transform 0.25s;
      font-style: normal;
    }
    .tracker-toggle.open .arrow {
      transform: rotate(180deg);
    }

    .tracker-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      opacity: 0;
    }
    .tracker-panel.open {
      max-height: 1200px;
      opacity: 1;
    }

    .tracker-inner {
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Drift indicator */
    .drift-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 16px;
    }
    .drift-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .drift-card-title {
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .drift-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .drift-badge.on-track  { background: #14532d; color: #4ade80; }
    .drift-badge.ahead     { background: #1e3a5f; color: #60a5fa; }
    .drift-badge.drifting  { background: #451a03; color: #fb923c; }
    .drift-badge.at-risk   { background: #450a0a; color: #f87171; }
    .drift-badge.no-data   { background: #1e293b; color: #475569; border: 1px solid #334155; }

    /* Dual-bar drift visualiser */
    .drift-bars {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .drift-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drift-bar-row-label {
      font-size: 10px;
      color: #475569;
      width: 44px;
      flex-shrink: 0;
      text-align: right;
    }
    .drift-bar-track {
      flex: 1;
      background: #0f172a;
      border-radius: 4px;
      height: 8px;
      position: relative;
      overflow: hidden;
    }
    .drift-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s;
    }
    .drift-bar-value {
      font-size: 10px;
      color: #64748b;
      width: 36px;
      flex-shrink: 0;
    }
    .drift-gap-label {
      text-align: center;
      font-size: 11px;
      color: #475569;
      margin-top: 8px;
    }

    /* Spot check */
    .spot-check-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }
    .spot-check-row input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 13px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .spot-check-row input:focus { border-color: #475569; }
    .spot-check-row input::placeholder { color: #334155; }
    .spot-btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 12px;
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .spot-btn:hover { background: #334155; color: #e2e8f0; }

    /* Sessions remaining */
    .sessions-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .sessions-stat { }
    .sessions-stat-label {
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .sessions-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .sessions-stat-sub {
      font-size: 10px;
      color: #334155;
      margin-top: 2px;
    }

    /* Log session form */
    .log-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 16px;
    }
    .log-card-title {
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .log-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .log-field label {
      display: block;
      font-size: 10px;
      color: #475569;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .log-field input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .log-field input:focus { border-color: #475569; }
    .log-field input::placeholder { color: #334155; }
    .log-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .log-delta-preview {
      font-size: 11px;
      color: #475569;
      flex: 1;
    }
    .log-delta-preview span { color: #22c55e; font-weight: 600; }
    .log-btn {
      background: #0f4c81;
      border: none;
      border-radius: 8px;
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 600;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .log-btn:hover { background: #1e5f9a; }
    .log-btn:disabled { background: #1e293b; color: #334155; cursor: not-allowed; }

    /* Avg stat */
    .avg-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .avg-left { }
    .avg-label {
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .avg-value {
      font-size: 20px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .avg-sample {
      font-size: 10px;
      color: #334155;
      margin-top: 2px;
    }
    .avg-right {
      text-align: right;
    }
    .avg-right-label {
      font-size: 10px;
      color: #475569;
      margin-bottom: 2px;
    }
    .avg-range {
      font-size: 12px;
      color: #64748b;
    }

    /* History table */
    .history-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 16px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .history-title {
      font-size: 11px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .clear-btn {
      background: none;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #475569;
      font-size: 10px;
      padding: 3px 8px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .clear-btn:hover { color: #f87171; border-color: #f87171; }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    .history-table th {
      color: #334155;
      font-weight: 500;
      text-align: left;
      padding: 0 4px 6px;
      letter-spacing: 0.5px;
      font-size: 10px;
    }
    .history-table td {
      color: #64748b;
      padding: 5px 4px;
      border-top: 1px solid #0f172a;
    }
    .history-table td.delta-pos { color: #4ade80; font-weight: 600; }
    .history-table td.delta-neg { color: #f87171; font-weight: 600; }
    .history-empty {
      text-align: center;
      color: #334155;
      font-size: 12px;
      padding: 16px 0 4px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ─── Constants ────────────────────────────────────────────────────────────
    const CYCLE_MS       = 7 * 24 * 60 * 60 * 1000;
    const AWST_OFFSET_MS = 8 * 60 * 60 * 1000;
    const DAY_LABELS     = ["Wed", "Thu", "Fri", "Sat", "Sun", "Mon", "Tue"];
    const DAY_ORDER      = [3, 4, 5, 6, 0, 1, 2];
    const MARKER_PCT     = (13 / 24) * 100;
    const WED_WINDOW     = 100 - MARKER_PCT;
    const STORAGE_KEY    = "claude-tracker-v1";

    // ─── Time helpers ─────────────────────────────────────────────────────────
    function getCycleStartUTC() {
      const nowMs    = Date.now();
      const awstMs   = nowMs + AWST_OFFSET_MS;
      const awstDate = new Date(awstMs);
      const dayOfWeek = awstDate.getUTCDay();
      const hourAWST  = awstDate.getUTCHours();
      const minAWST   = awstDate.getUTCMinutes();
      const secAWST   = awstDate.getUTCSeconds();
      let daysSinceWed = (dayOfWeek - 3 + 7) % 7;
      if (daysSinceWed === 0 && hourAWST < 13) daysSinceWed = 7;
      const elapsedTodayMs =
        hourAWST * 3600000 + minAWST * 60000 +
        secAWST * 1000     + awstDate.getUTCMilliseconds();
      const midnightWedAWST  = awstMs - elapsedTodayMs - daysSinceWed * 24 * 3600000;
      const cycleStartAWST   = midnightWedAWST + 13 * 3600000;
      return cycleStartAWST - AWST_OFFSET_MS;
    }

    function getActiveDayIndex() {
      const awstDate = new Date(Date.now() + AWST_OFFSET_MS);
      return DAY_ORDER.indexOf(awstDate.getUTCDay());
    }

    function formatDuration(ms) {
      if (ms <= 0) return "0s";
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const parts = [];
      if (d) parts.push(d + "d");
      if (h) parts.push(h + "h");
      if (m) parts.push(m + "m");
      parts.push(sec + "s");
      return parts.join(" ");
    }

    function formatAsAWST(utcMs) {
      return new Date(utcMs).toLocaleString("en-AU", {
        timeZone: "Australia/Perth",
        weekday: "short", month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false,
      });
    }

    function formatShortDate(utcMs) {
      return new Date(utcMs).toLocaleString("en-AU", {
        timeZone: "Australia/Perth",
        month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit",
        hour12: false,
      });
    }

    function barColour(pct) {
      if (pct < 50) return "#22c55e";
      if (pct < 75) return "#f59e0b";
      if (pct < 90) return "#ef4444";
      return "#dc2626";
    }

    // ─── Storage ──────────────────────────────────────────────────────────────
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { sessions: [], trackerOpen: false, spotWeekly: null };
        return JSON.parse(raw);
      } catch(e) {
        return { sessions: [], trackerOpen: false, spotWeekly: null };
      }
    }

    function saveData(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
    }

    // ─── Calculations ─────────────────────────────────────────────────────────
    function calcAvg(sessions) {
      if (!sessions.length) return null;
      const normalized = sessions.map(s => s.normalizedDelta);
      const avg = normalized.reduce((a, b) => a + b, 0) / normalized.length;
      const min = Math.min(...normalized);
      const max = Math.max(...normalized);
      return { avg, min, max, n: sessions.length };
    }

    function getDriftStatus(weeklyPct, timePct) {
      if (weeklyPct === null || weeklyPct === undefined) return "no-data";
      const gap = weeklyPct - timePct; // positive = ahead, negative = behind
      if (gap >= 5)  return "ahead";
      if (gap >= -5) return "on-track";
      if (gap >= -15) return "drifting";
      return "at-risk";
    }

    function getDriftLabel(status) {
      return { "ahead": "Ahead", "on-track": "On Track", "drifting": "Drifting", "at-risk": "At Risk", "no-data": "No Data" }[status];
    }

    // ─── Build DOM (once) ─────────────────────────────────────────────────────
    const app = document.getElementById("app");

    app.innerHTML = `
      <div class="header">
        <div class="header-label">Claude Usage Cycle</div>
        <div class="header-sub">Resets every Wednesday · 13:00 AWST</div>
      </div>

      <div class="big-pct">
        <div class="number" id="pctNumber">0.00<span class="unit">%</span></div>
        <div class="sub">of this week's cycle elapsed</div>
      </div>

      <div class="main-bar-wrap" id="mainBarWrap">
        <div class="main-bar-fill" id="mainBarFill"></div>
        <div class="main-bar-tick" style="left:25%"></div>
        <div class="main-bar-tick" style="left:50%"></div>
        <div class="main-bar-tick" style="left:75%"></div>
      </div>
      <div class="main-bar-labels">
        <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
      </div>

      <div class="day-grid" id="dayGrid"></div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Elapsed</div>
          <div class="stat-value large" id="statElapsed">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Remaining</div>
          <div class="stat-value large" id="statRemaining" style="color:#64748b">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Cycle started</div>
          <div class="stat-value small" id="statStarted" style="color:#94a3b8">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Resets at</div>
          <div class="stat-value small" id="statResets" style="color:#94a3b8">—</div>
        </div>
      </div>

      <div class="footer" id="footer">—</div>

      <!-- ── Layer 2 ──────────────────────────────────────────────────────── -->
      <button class="tracker-toggle" id="trackerToggle">
        Session Tracker <i class="arrow">▾</i>
      </button>

      <div class="tracker-panel" id="trackerPanel">
        <div class="tracker-inner">

          <!-- Drift Indicator -->
          <div class="drift-card">
            <div class="drift-card-header">
              <span class="drift-card-title">Weekly Usage vs Time Elapsed</span>
              <span class="drift-badge no-data" id="driftBadge">No Data</span>
            </div>
            <div class="drift-bars">
              <div class="drift-bar-row">
                <div class="drift-bar-row-label">Time</div>
                <div class="drift-bar-track">
                  <div class="drift-bar-fill" id="driftTimeBar" style="width:0%;background:#475569"></div>
                </div>
                <div class="drift-bar-value" id="driftTimeVal">0%</div>
              </div>
              <div class="drift-bar-row">
                <div class="drift-bar-row-label">Weekly</div>
                <div class="drift-bar-track">
                  <div class="drift-bar-fill" id="driftWeeklyBar" style="width:0%;background:#334155"></div>
                </div>
                <div class="drift-bar-value" id="driftWeeklyVal">—</div>
              </div>
            </div>
            <div class="drift-gap-label" id="driftGapLabel">Enter your current weekly % below to see drift</div>
            <!-- Spot check -->
            <div class="spot-check-row">
              <input type="number" id="spotInput" min="0" max="100" step="0.1" placeholder="Current weekly % (e.g. 34)" />
              <button class="spot-btn" id="spotBtn">Check Drift</button>
            </div>
          </div>

          <!-- Sessions remaining + avg -->
          <div class="sessions-card" id="sessionsCard">
            <div class="sessions-stat">
              <div class="sessions-stat-label">Sessions Left</div>
              <div class="sessions-stat-value" id="sessionsLeft">—</div>
              <div class="sessions-stat-sub" id="sessionsLeftSub">log sessions to calculate</div>
            </div>
            <div class="sessions-stat">
              <div class="sessions-stat-label">Avg Session Value</div>
              <div class="sessions-stat-value" id="avgSessionVal">—</div>
              <div class="sessions-stat-sub" id="avgSessionSub">no data yet</div>
            </div>
          </div>

          <!-- Log a session -->
          <div class="log-card">
            <div class="log-card-title">Log a Session</div>
            <div class="log-inputs">
              <div class="log-field">
                <label>Week % Before</label>
                <input type="number" id="logBefore" min="0" max="100" step="0.1" placeholder="e.g. 23" />
              </div>
              <div class="log-field">
                <label>Session % Used</label>
                <input type="number" id="logSession" min="1" max="100" step="1" placeholder="e.g. 80" />
              </div>
              <div class="log-field">
                <label>Week % After</label>
                <input type="number" id="logAfter" min="0" max="100" step="0.1" placeholder="e.g. 28" />
              </div>
            </div>
            <div class="log-row">
              <div class="log-delta-preview" id="logPreview">Fill in all three fields to preview</div>
              <button class="log-btn" id="logBtn" disabled>+ Log Session</button>
            </div>
          </div>

          <!-- History -->
          <div class="history-card">
            <div class="history-header">
              <span class="history-title">Session History</span>
              <button class="clear-btn" id="clearBtn">Clear All</button>
            </div>
            <div id="historyBody"></div>
          </div>

        </div>
      </div>
    `;

    // Build day cells
    const dayGrid = document.getElementById("dayGrid");
    DAY_LABELS.forEach((label, i) => {
      const cell = document.createElement("div");
      cell.className = "day-cell";
      cell.id = "day-" + i;
      cell.innerHTML = `
        <div class="day-bar" id="daybar-${i}">
          <div class="day-bar-fill" id="dayfill-${i}" style="left:0;width:0"></div>
          ${i === 0 ? `<div class="day-marker" style="left:${MARKER_PCT}%"></div>` : ""}
        </div>
        <div class="day-label" id="daylabel-${i}">${label}</div>
        ${i === 0 ? `<div class="day-time">13:00</div>` : ""}
      `;
      dayGrid.appendChild(cell);
    });

    // ─── Layer 2 state ────────────────────────────────────────────────────────
    let trackerData = loadData();

    // Restore panel open state
    const trackerToggle = document.getElementById("trackerToggle");
    const trackerPanel  = document.getElementById("trackerPanel");
    if (trackerData.trackerOpen) {
      trackerToggle.classList.add("open");
      trackerPanel.classList.add("open");
    }

    trackerToggle.addEventListener("click", () => {
      const isOpen = trackerPanel.classList.toggle("open");
      trackerToggle.classList.toggle("open", isOpen);
      trackerData.trackerOpen = isOpen;
      saveData(trackerData);
    });

    // ─── Log inputs: live preview ──────────────────────────────────────────────
    const logBefore  = document.getElementById("logBefore");
    const logSession = document.getElementById("logSession");
    const logAfter   = document.getElementById("logAfter");
    const logPreview = document.getElementById("logPreview");
    const logBtn     = document.getElementById("logBtn");

    function updateLogPreview() {
      const b = parseFloat(logBefore.value);
      const s = parseFloat(logSession.value);
      const a = parseFloat(logAfter.value);
      if (!isNaN(b) && !isNaN(s) && !isNaN(a) && s > 0) {
        const delta = a - b;
        const norm  = delta / (s / 100);
        if (delta < 0) {
          logPreview.innerHTML = `<span style="color:#f87171">⚠ Week % after is less than before</span>`;
          logBtn.disabled = true;
        } else {
          logPreview.innerHTML = `Δ <span>+${delta.toFixed(1)}%</span> weekly &nbsp;·&nbsp; <span>${norm.toFixed(2)}%</span> per full session`;
          logBtn.disabled = false;
        }
      } else {
        logPreview.textContent = "Fill in all three fields to preview";
        logBtn.disabled = true;
      }
    }

    [logBefore, logSession, logAfter].forEach(el => el.addEventListener("input", updateLogPreview));

    logBtn.addEventListener("click", () => {
      const b = parseFloat(logBefore.value);
      const s = parseFloat(logSession.value);
      const a = parseFloat(logAfter.value);
      if (isNaN(b) || isNaN(s) || isNaN(a) || s <= 0 || a < b) return;
      const delta = a - b;
      const norm  = delta / (s / 100);
      trackerData.sessions.unshift({
        ts: Date.now(),
        weekBefore: b,
        sessionUsed: s,
        weekAfter: a,
        delta: parseFloat(delta.toFixed(2)),
        normalizedDelta: parseFloat(norm.toFixed(3))
      });
      // Also update spot weekly to latest "after"
      trackerData.spotWeekly = a;
      saveData(trackerData);
      logBefore.value  = "";
      logSession.value = "";
      logAfter.value   = "";
      logBtn.disabled  = true;
      logPreview.textContent = "Fill in all three fields to preview";
      renderLayer2();
    });

    // ─── Spot check ──────────────────────────────────────────────────────────
    const spotInput = document.getElementById("spotInput");
    const spotBtn   = document.getElementById("spotBtn");

    // Pre-fill if we have a stored value
    if (trackerData.spotWeekly !== null) {
      spotInput.value = trackerData.spotWeekly;
    }

    spotBtn.addEventListener("click", () => {
      const v = parseFloat(spotInput.value);
      if (isNaN(v) || v < 0 || v > 100) return;
      trackerData.spotWeekly = v;
      saveData(trackerData);
      renderLayer2();
    });

    spotInput.addEventListener("keydown", e => { if (e.key === "Enter") spotBtn.click(); });

    // ─── Clear history ────────────────────────────────────────────────────────
    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm("Clear all session history?")) return;
      trackerData.sessions    = [];
      trackerData.spotWeekly  = null;
      spotInput.value = "";
      saveData(trackerData);
      renderLayer2();
    });

    // ─── Render Layer 2 ───────────────────────────────────────────────────────
    function renderLayer2() {
      const nowMs        = Date.now();
      const cycleStartMs = getCycleStartUTC();
      const cycleEndMs   = cycleStartMs + CYCLE_MS;
      const elapsedMs    = nowMs - cycleStartMs;
      const remainingMs  = cycleEndMs - nowMs;
      const timePct      = Math.min(100, Math.max(0, (elapsedMs / CYCLE_MS) * 100));

      // Current weekly % — prefer most recent session log "after", else spot check
      const weeklyPct = trackerData.spotWeekly;

      // ── Drift bars ──
      const driftTimeBar    = document.getElementById("driftTimeBar");
      const driftWeeklyBar  = document.getElementById("driftWeeklyBar");
      const driftTimeVal    = document.getElementById("driftTimeVal");
      const driftWeeklyVal  = document.getElementById("driftWeeklyVal");
      const driftBadge      = document.getElementById("driftBadge");
      const driftGapLabel   = document.getElementById("driftGapLabel");

      driftTimeBar.style.width      = timePct + "%";
      driftTimeBar.style.background = "#475569";
      driftTimeVal.textContent      = timePct.toFixed(1) + "%";

      const status = getDriftStatus(weeklyPct, timePct);
      driftBadge.className = "drift-badge " + status;
      driftBadge.textContent = getDriftLabel(status);

      if (weeklyPct !== null && weeklyPct !== undefined) {
        const weekColour = status === "ahead"    ? "#60a5fa"
                         : status === "on-track" ? "#4ade80"
                         : status === "drifting" ? "#fb923c"
                         : "#f87171";
        driftWeeklyBar.style.width      = Math.min(100, weeklyPct) + "%";
        driftWeeklyBar.style.background = weekColour;
        driftWeeklyVal.textContent      = weeklyPct.toFixed(1) + "%";

        const gap = weeklyPct - timePct;
        if (gap > 0) {
          driftGapLabel.textContent = `You're ${gap.toFixed(1)}% ahead of target`;
          driftGapLabel.style.color = "#4ade80";
        } else if (gap < 0) {
          driftGapLabel.textContent = `You're ${Math.abs(gap).toFixed(1)}% behind target`;
          driftGapLabel.style.color = status === "drifting" ? "#fb923c" : status === "at-risk" ? "#f87171" : "#64748b";
        } else {
          driftGapLabel.textContent = "Perfectly on target";
          driftGapLabel.style.color = "#4ade80";
        }
      } else {
        driftWeeklyBar.style.width = "0%";
        driftWeeklyVal.textContent = "—";
        driftGapLabel.textContent  = "Enter your current weekly % below to see drift";
        driftGapLabel.style.color  = "#475569";
      }

      // ── Sessions remaining ──
      const avgData = calcAvg(trackerData.sessions);
      const sessionsLeftEl  = document.getElementById("sessionsLeft");
      const sessionsLeftSub = document.getElementById("sessionsLeftSub");
      const avgSessionVal   = document.getElementById("avgSessionVal");
      const avgSessionSub   = document.getElementById("avgSessionSub");

      if (avgData) {
        avgSessionVal.textContent = avgData.avg.toFixed(2) + "%";
        avgSessionSub.textContent = `based on ${avgData.n} session${avgData.n > 1 ? "s" : ""}`;

        if (weeklyPct !== null && weeklyPct !== undefined) {
          const remaining   = 100 - weeklyPct;
          const sessionsLeft = remaining / avgData.avg;
          sessionsLeftEl.textContent  = sessionsLeft.toFixed(1);
          sessionsLeftSub.textContent = `at ${avgData.avg.toFixed(2)}% avg per session`;
        } else {
          sessionsLeftEl.textContent  = "—";
          sessionsLeftSub.textContent = "set weekly % to calculate";
        }
      } else {
        avgSessionVal.textContent = "—";
        avgSessionSub.textContent = "no sessions logged yet";
        sessionsLeftEl.textContent  = "—";
        sessionsLeftSub.textContent = "log sessions to calculate";
      }

      // ── History table ──
      const historyBody = document.getElementById("historyBody");
      const sessions    = trackerData.sessions.slice(0, 10);

      if (!sessions.length) {
        historyBody.innerHTML = `<div class="history-empty">No sessions logged yet</div>`;
        return;
      }

      const rows = sessions.map(s => `
        <tr>
          <td>${formatShortDate(s.ts)}</td>
          <td>${s.weekBefore}%→${s.weekAfter}%</td>
          <td>${s.sessionUsed}%</td>
          <td class="delta-pos">+${s.delta.toFixed(1)}%</td>
          <td>${s.normalizedDelta.toFixed(2)}%</td>
        </tr>
      `).join("");

      historyBody.innerHTML = `
        <table class="history-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Week Before→After</th>
              <th>Session</th>
              <th>Δ</th>
              <th>Per 100%</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // ─── Layer 1 Update loop ──────────────────────────────────────────────────
    function update() {
      const nowMs        = Date.now();
      const cycleStartMs = getCycleStartUTC();
      const cycleEndMs   = cycleStartMs + CYCLE_MS;
      const elapsedMs    = nowMs - cycleStartMs;
      const remainingMs  = cycleEndMs - nowMs;
      const pct          = Math.min(100, Math.max(0, (elapsedMs / CYCLE_MS) * 100));
      const colour       = barColour(pct);
      const activeDayIdx = getActiveDayIndex();

      const pctEl = document.getElementById("pctNumber");
      pctEl.style.color = colour;
      pctEl.innerHTML   = pct.toFixed(2) + '<span class="unit">%</span>';

      const fill = document.getElementById("mainBarFill");
      fill.style.width      = pct + "%";
      fill.style.background = `linear-gradient(90deg, ${colour}88, ${colour})`;

      DAY_LABELS.forEach((_, i) => {
        const done   = i < activeDayIdx;
        const active = i === activeDayIdx;
        const bar    = document.getElementById("daybar-" + i);
        const fillEl = document.getElementById("dayfill-" + i);
        const labelEl= document.getElementById("daylabel-" + i);

        bar.style.border       = active ? `1px solid ${colour}` : "1px solid transparent";
        labelEl.style.color    = active ? "#e2e8f0" : done ? "#475569" : "#334155";
        labelEl.style.fontWeight = active ? "700" : "400";

        if (i === 0) {
          if (active) {
            const awstDate  = new Date(nowMs + AWST_OFFSET_MS);
            const msIntoDay = awstDate.getUTCHours() * 3600000 + awstDate.getUTCMinutes() * 60000 + awstDate.getUTCSeconds() * 1000;
            const dayPct    = (msIntoDay / (24 * 3600000)) * 100;
            if (dayPct < MARKER_PCT) {
              fillEl.style.left = "0%"; fillEl.style.width = dayPct + "%"; fillEl.style.background = colour;
            } else {
              fillEl.style.left = MARKER_PCT + "%"; fillEl.style.width = (dayPct - MARKER_PCT) + "%"; fillEl.style.background = colour;
            }
          } else if (done) {
            fillEl.style.left = MARKER_PCT + "%"; fillEl.style.width = WED_WINDOW + "%"; fillEl.style.background = "#334155";
          } else {
            fillEl.style.left = "0%"; fillEl.style.width = "0%";
          }
        } else {
          fillEl.style.left = "0%";
          if (done) {
            fillEl.style.width = "100%"; fillEl.style.background = "#334155";
          } else if (active) {
            const awstDate  = new Date(nowMs + AWST_OFFSET_MS);
            const msIntoDay = awstDate.getUTCHours() * 3600000 + awstDate.getUTCMinutes() * 60000 + awstDate.getUTCSeconds() * 1000;
            fillEl.style.width = ((msIntoDay / (24 * 3600000)) * 100) + "%"; fillEl.style.background = colour;
          } else {
            fillEl.style.width = "0%";
          }
        }
      });

      document.getElementById("statElapsed").style.color   = colour;
      document.getElementById("statElapsed").textContent   = formatDuration(elapsedMs);
      document.getElementById("statRemaining").textContent = formatDuration(remainingMs);
      document.getElementById("statStarted").textContent   = formatAsAWST(cycleStartMs);
      document.getElementById("statResets").textContent    = formatAsAWST(cycleEndMs);
      document.getElementById("footer").textContent        = "Current AWST: " + formatAsAWST(nowMs);
    }

    update();
    renderLayer2();
    setInterval(update, 1000);
    setInterval(renderLayer2, 10000); // refresh layer 2 every 10s

    // ─── Service Worker ───────────────────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
