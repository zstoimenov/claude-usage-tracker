<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Claude Usage Cycle</title>

  <!-- PWA Meta -->
  <meta name="description" content="Track your Claude weekly usage cycle — resets every Wednesday at 13:00 AWST" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claude Cycle" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'Inter', 'Helvetica Neue', sans-serif;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      color: #e2e8f0;
    }

    #app {
      width: 100%;
      max-width: 560px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header-label {
      font-size: 13px;
      letter-spacing: 3px;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .header-sub {
      font-size: 13px;
      color: #475569;
    }

    .big-pct {
      text-align: center;
      margin-bottom: 28px;
    }
    .big-pct .number {
      font-size: clamp(64px, 16vw, 88px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 1;
      transition: color 1s;
    }
    .big-pct .unit {
      font-size: clamp(28px, 7vw, 40px);
      font-weight: 400;
      color: #94a3b8;
    }
    .big-pct .sub {
      font-size: 14px;
      color: #64748b;
      margin-top: 6px;
    }

    .main-bar-wrap {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      height: 20px;
      margin-bottom: 8px;
      position: relative;
    }
    .main-bar-fill {
      height: 100%;
      border-radius: 12px;
      transition: width 0.5s, background 1s;
    }
    .main-bar-tick {
      position: absolute;
      top: 0;
      width: 1px;
      height: 100%;
      background: rgba(15,23,42,0.4);
    }
    .main-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #475569;
      margin-bottom: 28px;
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 28px;
    }
    .day-cell {
      text-align: center;
    }
    .day-bar {
      position: relative;
      background: #1e293b;
      border-radius: 6px;
      height: 6px;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .day-bar.active {
      /* border set dynamically */
    }
    .day-bar-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s;
    }
    .day-marker {
      position: absolute;
      top: 50%;
      width: 2px;
      height: 12px;
      background: #f8fafc;
      border-radius: 1px;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: 0 0 4px rgba(248,250,252,0.53);
    }
    .day-label {
      font-size: 11px;
      transition: color 0.3s;
    }
    .day-time {
      font-size: 9px;
      color: #475569;
      margin-top: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 11px;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      font-weight: 600;
    }
    .stat-value.large { font-size: 18px; }
    .stat-value.small { font-size: 12px; }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ─── Constants ────────────────────────────────────────────────────────────
    const CYCLE_MS       = 7 * 24 * 60 * 60 * 1000;
    const AWST_OFFSET_MS = 8 * 60 * 60 * 1000;
    const DAY_LABELS     = ["Wed", "Thu", "Fri", "Sat", "Sun", "Mon", "Tue"];
    const DAY_ORDER      = [3, 4, 5, 6, 0, 1, 2]; // getUTCDay() for each slot
    const MARKER_PCT     = (13 / 24) * 100;        // 54.166…%
    const WED_WINDOW     = 100 - MARKER_PCT;       // 45.833…%

    // ─── Time helpers ─────────────────────────────────────────────────────────
    function getCycleStartUTC() {
      const nowMs    = Date.now();
      const awstMs   = nowMs + AWST_OFFSET_MS;
      const awstDate = new Date(awstMs);

      const dayOfWeek = awstDate.getUTCDay();
      const hourAWST  = awstDate.getUTCHours();
      const minAWST   = awstDate.getUTCMinutes();
      const secAWST   = awstDate.getUTCSeconds();

      let daysSinceWed = (dayOfWeek - 3 + 7) % 7;
      if (daysSinceWed === 0 && hourAWST < 13) daysSinceWed = 7;

      const elapsedTodayMs =
        hourAWST * 3600000 + minAWST * 60000 +
        secAWST * 1000     + awstDate.getUTCMilliseconds();

      const midnightWedAWST  = awstMs - elapsedTodayMs - daysSinceWed * 24 * 3600000;
      const cycleStartAWST   = midnightWedAWST + 13 * 3600000;
      return cycleStartAWST - AWST_OFFSET_MS;
    }

    function getActiveDayIndex() {
      const awstDate = new Date(Date.now() + AWST_OFFSET_MS);
      return DAY_ORDER.indexOf(awstDate.getUTCDay());
    }

    function formatDuration(ms) {
      if (ms <= 0) return "0s";
      const s = Math.floor(ms / 1000);
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      const parts = [];
      if (d) parts.push(d + "d");
      if (h) parts.push(h + "h");
      if (m) parts.push(m + "m");
      parts.push(sec + "s");
      return parts.join(" ");
    }

    function formatAsAWST(utcMs) {
      return new Date(utcMs).toLocaleString("en-AU", {
        timeZone: "Australia/Perth",
        weekday: "short", month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false,
      });
    }

    function barColour(pct) {
      if (pct < 50) return "#22c55e";
      if (pct < 75) return "#f59e0b";
      if (pct < 90) return "#ef4444";
      return "#dc2626";
    }

    // ─── Build DOM (once) ─────────────────────────────────────────────────────
    const app = document.getElementById("app");

    app.innerHTML = `
      <div class="header">
        <div class="header-label">Claude Usage Cycle</div>
        <div class="header-sub">Resets every Wednesday · 13:00 AWST</div>
      </div>

      <div class="big-pct">
        <div class="number" id="pctNumber">0.00<span class="unit">%</span></div>
        <div class="sub">of this week's cycle elapsed</div>
      </div>

      <div class="main-bar-wrap" id="mainBarWrap">
        <div class="main-bar-fill" id="mainBarFill"></div>
        <div class="main-bar-tick" style="left:25%"></div>
        <div class="main-bar-tick" style="left:50%"></div>
        <div class="main-bar-tick" style="left:75%"></div>
      </div>
      <div class="main-bar-labels">
        <span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span>
      </div>

      <div class="day-grid" id="dayGrid"></div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Elapsed</div>
          <div class="stat-value large" id="statElapsed">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Remaining</div>
          <div class="stat-value large" id="statRemaining" style="color:#64748b">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Cycle started</div>
          <div class="stat-value small" id="statStarted" style="color:#94a3b8">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Resets at</div>
          <div class="stat-value small" id="statResets" style="color:#94a3b8">—</div>
        </div>
      </div>

      <div class="footer" id="footer">—</div>
    `;

    // Build day cells
    const dayGrid = document.getElementById("dayGrid");
    DAY_LABELS.forEach((label, i) => {
      const cell = document.createElement("div");
      cell.className = "day-cell";
      cell.id = "day-" + i;
      cell.innerHTML = `
        <div class="day-bar" id="daybar-${i}">
          <div class="day-bar-fill" id="dayfill-${i}" style="left:0;width:0"></div>
          ${i === 0 ? `<div class="day-marker" style="left:${MARKER_PCT}%"></div>` : ""}
        </div>
        <div class="day-label" id="daylabel-${i}">${label}</div>
        ${i === 0 ? `<div class="day-time">13:00</div>` : ""}
      `;
      dayGrid.appendChild(cell);
    });

    // ─── Update loop ──────────────────────────────────────────────────────────
    function update() {
      const nowMs        = Date.now();
      const cycleStartMs = getCycleStartUTC();
      const cycleEndMs   = cycleStartMs + CYCLE_MS;
      const elapsedMs    = nowMs - cycleStartMs;
      const remainingMs  = cycleEndMs - nowMs;
      const pct          = Math.min(100, Math.max(0, (elapsedMs / CYCLE_MS) * 100));
      const colour       = barColour(pct);
      const activeDayIdx = getActiveDayIndex();

      // Big number
      const pctEl = document.getElementById("pctNumber");
      pctEl.style.color = colour;
      pctEl.innerHTML   = pct.toFixed(2) + '<span class="unit">%</span>';

      // Main bar
      const fill = document.getElementById("mainBarFill");
      fill.style.width      = pct + "%";
      fill.style.background = `linear-gradient(90deg, ${colour}88, ${colour})`;

      // Day segments
      DAY_LABELS.forEach((_, i) => {
        const done   = i < activeDayIdx;
        const active = i === activeDayIdx;
        const bar    = document.getElementById("daybar-" + i);
        const fillEl = document.getElementById("dayfill-" + i);
        const labelEl= document.getElementById("daylabel-" + i);

        // Border on active
        bar.style.border = active ? `1px solid ${colour}` : "1px solid transparent";

        // Label colour
        labelEl.style.color      = active ? "#e2e8f0" : done ? "#475569" : "#334155";
        labelEl.style.fontWeight = active ? "700" : "400";

        if (i === 0) {
          // Wednesday logic
          if (active) {
            const awstDate = new Date(nowMs + AWST_OFFSET_MS);
            const msIntoDay = awstDate.getUTCHours() * 3600000
              + awstDate.getUTCMinutes() * 60000
              + awstDate.getUTCSeconds() * 1000;
            const dayPct = (msIntoDay / (24 * 3600000)) * 100;
            if (dayPct < MARKER_PCT) {
              fillEl.style.left       = "0%";
              fillEl.style.width      = dayPct + "%";
              fillEl.style.background = colour;
            } else {
              fillEl.style.left       = MARKER_PCT + "%";
              fillEl.style.width      = (dayPct - MARKER_PCT) + "%";
              fillEl.style.background = colour;
            }
          } else if (done) {
            fillEl.style.left       = MARKER_PCT + "%";
            fillEl.style.width      = WED_WINDOW + "%";
            fillEl.style.background = "#334155";
          } else {
            fillEl.style.left  = "0%";
            fillEl.style.width = "0%";
          }
        } else {
          fillEl.style.left = "0%";
          if (done) {
            fillEl.style.width      = "100%";
            fillEl.style.background = "#334155";
          } else if (active) {
            const awstDate = new Date(nowMs + AWST_OFFSET_MS);
            const msIntoDay = awstDate.getUTCHours() * 3600000
              + awstDate.getUTCMinutes() * 60000
              + awstDate.getUTCSeconds() * 1000;
            fillEl.style.width      = ((msIntoDay / (24 * 3600000)) * 100) + "%";
            fillEl.style.background = colour;
          } else {
            fillEl.style.width = "0%";
          }
        }
      });

      // Stats
      document.getElementById("statElapsed").style.color   = colour;
      document.getElementById("statElapsed").textContent   = formatDuration(elapsedMs);
      document.getElementById("statRemaining").textContent = formatDuration(remainingMs);
      document.getElementById("statStarted").textContent   = formatAsAWST(cycleStartMs);
      document.getElementById("statResets").textContent    = formatAsAWST(cycleEndMs);
      document.getElementById("footer").textContent        = "Current AWST: " + formatAsAWST(nowMs);
    }

    update();
    setInterval(update, 1000);

    // ─── Service Worker registration ──────────────────────────────────────────
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
